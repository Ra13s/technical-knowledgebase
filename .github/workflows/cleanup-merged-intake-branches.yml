name: Cleanup merged branches

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-intake-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref != github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged same-repository branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          delete_ref() {
            local ref="$1"
            [[ -z "$ref" || "$ref" == "$DEFAULT_BRANCH" ]] && return 0
            echo "Deleting merged branch: $ref"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$ref" >/dev/null 2>&1 || true
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            delete_ref "$HEAD_REF"
            exit 0
          fi

          # Backfill cleanup for historical merged PRs whose source branch
          # belongs to this repository. Fork branches are intentionally ignored.
          gh api --paginate "repos/$REPO/pulls?state=closed&per_page=100" \
            --jq --arg repo "$REPO" '.[] | select(.merged_at != null and .head.repo.full_name == $repo) | .head.ref' |
          while IFS= read -r ref; do
            delete_ref "$ref"
          done
